        * {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #0f172a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 1250px;
            height: 97vh;
            background: #f8fafc;
            color: #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        /* شاشة اختيار الفئات */
        #selectionScreen {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .selection-header {
            text-align: center;
            margin-bottom: 5px;
        }
        .selection-header h2 { color: #312e81; font-size: 1.9rem; margin-bottom: 3px; }
        .selection-header p { color: #64748b; font-size: 1.05rem; font-weight: bold; }

        .categories-picker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            padding: 5px;
        }

        .picker-card {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 85px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.03);
        }

        .picker-card:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.2);
        }

        .picker-card.selected {
            background: linear-gradient(135deg, #e0e7ff, #ede9fe);
            border-color: #4f46e5;
            color: #312e81;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }

        .picker-card h4 { font-size: 1rem; margin-bottom: 2px; color: #1e1b4b; }
        .picker-card span { font-size: 0.75rem; color: #64748b; }

        .start-game-btn {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.25rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .start-game-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.5);
        }

        .start-game-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* شاشة اللعبة */
        #gameScreen {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e1b4b, #4f46e5);
            padding: 12px 20px;
            border-radius: 14px;
            color: white;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .game-header h1 { font-size: 1.3rem; }

        .game-header button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        .game-header button:hover { background: rgba(255,255,255,0.35); }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            flex-grow: 1;
            margin: 12px 0;
            overflow-y: auto;
            padding: 5px;
        }

        .tile {
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.35rem;
            font-weight: bold;
            color: #1e1b4b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.25s ease;
            min-height: 80px;
            border: 2px solid #e2e8f0;
            padding: 5px;
        }

        .tile span.cat-label {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .tile:hover {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            border-color: #4f46e5;
            transform: translateY(-3px);
            color: #312e81;
        }

        .tile.disabled {
            background: #e2e8f0;
            color: #94a3b8;
            border-color: transparent;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .tile.disabled span.cat-label { color: #94a3b8; }

        /* شريط النقاط والأسماء */
        .players-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
        }

        .player-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
        }

        .player-box.red-theme {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-color: #b91c1c;
        }

        .player-box.blue-theme {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-color: #1d4ed8;
        }

        .score-btn {
            background: rgba(0,0,0,0.15);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .score-btn:hover { background: rgba(0,0,0,0.3); }

        .editable-name {
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(255,255,255,0.7);
            color: inherit;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: center;
            width: 110px;
            outline: none;
            padding: 2px;
        }

        .center-logo h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* نافذة السؤال (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 580px;
            text-align: center;
            color: #333;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 { color: #4f46e5; font-size: 1.2rem; margin-bottom: 10px; }
        .modal-content p { font-size: 1.35rem; margin: 15px 0; line-height: 1.6; color: #1e1b4b; font-weight: 600; }
        
        #modalAnswerText {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            color: #16a34a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            font-size: 1.2rem;
        }

        #modalAnswerText:hover { background: #f1f5f9; }

        .modal-close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #1e1b4b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            font-weight: bold;
        }

        .modal-close-btn:hover { background: #312e81; }
    </style>
</head>

        let selectedCategoryIds = [];

        const pickerGrid = document.getElementById('pickerGrid');
        allCategories.forEach(cat => {
            const card = document.createElement('div');
            card.classList.add('picker-card');
            card.innerHTML = `
                <div style="font-size: 1.8rem; margin-bottom: 3px;">${cat.icon}</div>
                <h4>${cat.name}</h4>
                <span>6 أسئلة ممتعة</span>
            `;
            card.addEventListener('click', () => toggleCategorySelection(cat.id, card));
            pickerGrid.appendChild(card);
        });

        function toggleCategorySelection(catId, cardElement) {
            const index = selectedCategoryIds.indexOf(catId);
            if (index > -1) {
                selectedCategoryIds.splice(index, 1);
                cardElement.classList.remove('selected');
            } else {
                if (selectedCategoryIds.length < 6) {
                    selectedCategoryIds.push(catId);
                    cardElement.classList.add('selected');
                } else {
                    alert('يمكنك اختيار 6 فئات فقط لكل جولة!');
                }
            }
            document.getElementById('counterText').innerText = `تم اختيار (${selectedCategoryIds.length} / 6) فئات`;
            document.getElementById('startBtn').disabled = selectedCategoryIds.length !== 6;
        }

        let activeCategoriesData = [];
        let currentCatIdx = 0;
        let currentQIdx = 0;
        let activeTileElement = null;
        let currentAnswerText = "";

        function startGame() {
            activeCategoriesData = allCategories.filter(cat => selectedCategoryIds.includes(cat.id));
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            buildBoard();
        }

        function buildBoard() {
            const boardGrid = document.getElementById('boardGrid');
            boardGrid.innerHTML = '';
            activeCategoriesData.forEach((cat, catIdx) => {
                cat.questions.forEach((qObj, qIdx) => {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.innerHTML = `<span>${qObj.points}</span><span class="cat-label">${cat.name}</span>`;
                    tile.addEventListener('click', () => {
                        if (!tile.classList.contains('disabled')) {
                            openQuestionModal(catIdx, qIdx, tile);
                        }
                    });
                    boardGrid.appendChild(tile);
                });
            });
        }

        function openQuestionModal(catIdx, qIdx, tileElement) {
            currentCatIdx = catIdx;
            currentQIdx = qIdx;
            activeTileElement = tileElement;
            const category = activeCategoriesData[catIdx];
            const qData = category.questions[qIdx];
            currentAnswerText = qData.a;

            document.getElementById('modalCategory').innerText = `فئة: ${category.name} (${qData.points} نقطة)`;
            document.getElementById('modalQuestionText').innerText = qData.q;
            
            const ansDiv = document.getElementById('modalAnswerText');
            ansDiv.innerText = "[اضغط هنا لعرض الإجابة الصحيحة]";
            ansDiv.style.color = "#16a34a";

            document.getElementById('questionModal').style.display = 'flex';
        }

        function revealAnswer() {
            const ansDiv = document.getElementById('modalAnswerText');
            ansDiv.innerText = `الإجابة الصحيحة: ${currentAnswerText}`;
            ansDiv.style.color = "#dc2626";
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            if (activeTileElement) {
                activeTileElement.classList.add('disabled');
                activeTileElement.innerHTML = `<span>✓</span><span class="cat-label">تم</span>`;
            }
        }

        let scores = { player1: 400, player2: 400 };

        function adjustScore(player, amount) {
            scores[player] += amount;
            document.getElementById('score1').innerText = scores.player1;
            document.getElementById('score2').innerText = scores.player2;
        }
