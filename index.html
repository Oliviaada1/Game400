<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحدي الكبرى - النسخة الملونة والمخصصة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            height: 97vh;
            background: #f8fafc;
            color: #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* شاشة اختيار الفئات */
        #selectionScreen {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .selection-header {
            text-align: center;
            margin-bottom: 10px;
        }
        .selection-header h2 { color: #1e1b4b; font-size: 2rem; margin-bottom: 5px; }
        .selection-header p { color: #64748b; font-size: 1.1rem; }

        .categories-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
        }

        .picker-card {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 95px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
        }

        .picker-card:hover {
            border-color: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.15);
        }

        .picker-card.selected {
            background: linear-gradient(135deg, #e0e7ff, #ede9fe);
            border-color: #6366f1;
            color: #4338ca;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .picker-card h4 { font-size: 1.15rem; margin-bottom: 3px; color: #1e1b4b; }
        .picker-card span { font-size: 0.8rem; color: #64748b; }

        .start-game-btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.25rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .start-game-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.6);
        }

        .start-game-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* شاشة اللعبة */
        #gameScreen {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .game-header h1 { font-size: 1.3rem; }

        .game-header button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        .game-header button:hover { background: rgba(255,255,255,0.35); }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            flex-grow: 1;
            margin: 12px 0;
            overflow-y: auto;
            padding: 5px;
        }

        .tile {
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #1e1b4b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.25s ease;
            min-height: 80px;
            border: 2px solid #e2e8f0;
            padding: 5px;
        }

        .tile span.cat-label {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .tile:hover {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            border-color: #6366f1;
            transform: translateY(-3px);
            color: #312e81;
        }

        .tile.disabled {
            background: #e2e8f0;
            color: #94a3b8;
            border-color: transparent;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .tile.disabled span.cat-label { color: #94a3b8; }

        /* شريط النقاط والأسماء القابلة للتعديل */
        .players-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
        }

        .player-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 35px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
        }

        .player-box.red-theme {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-color: #b91c1c;
        }

        .player-box.blue-theme {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-color: #1d4ed8;
        }

        .score-btn {
            background: rgba(0,0,0,0.12);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .score-btn:hover { background: rgba(0,0,0,0.25); }

        .editable-name {
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(255,255,255,0.6);
            color: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            width: 100px;
            outline: none;
            padding: 2px;
        }

        .center-logo h2 {
            color: #1e1b4b;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* نافذة السؤال (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            color: #333;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 { color: #4f46e5; font-size: 1.15rem; margin-bottom: 10px; }
        .modal-content p { font-size: 1.3rem; margin: 15px 0; line-height: 1.6; color: #1e1b4b; font-weight: 500; }
        
        .modal-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin: 10px 0;
            object-fit: contain;
        }

        #modalAnswerText {
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            border: 2px dashed #cbd5e1;
            color: #16a34a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            font-size: 1.2rem;
        }

        #modalAnswerText:hover { background: #f1f5f9; }

        .modal-close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #1e1b4b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            font-weight: bold;
        }

        .modal-close-btn:hover { background: #312e81; }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- شاشة اختيار الفئات -->
        <div id="selectionScreen">
            <div class="selection-header">
                <h2>✨ اختر 6 فئات لتلعب بها الآن</h2>

            </div>
            
            <div class="categories-picker-grid" id="pickerGrid">
                <!-- يتم توليد البطاقات ديناميكياً -->
            </div>

            <button class="start-game-btn" id="startBtn" disabled onclick="startGame()">ابدأ التحدي الملون والممتع!</button>
        </div>

        <!-- شاشة اللعبة الفعالة -->
        <div id="gameScreen">
            <header class="game-header">
                <button onclick="location.reload()">🔄 تغيير الفئات</button>
                <h1>🏆 لوحة التحدي التفاعلية</h1>
                <button onclick="alert('انقر على اسم أي لاعب لتغييره، اختر المربع، اطرح السؤال، ثم انقر لإظهار الإجابة!')">💡 تعليمات اللعب</button>

            <main class="board-grid" id="boardGrid">
                <!-- شبكة الأسئلة والنقاط -->

            <footer class="players-footer">
                <div class="player-box blue-theme">

                    <button class="score-btn" onclick="adjustScore('player1', 200)">+</button>
                    <input type="text" class="editable-name" value="فرح">
                </div>
                
                <div class="center-logo">
                    <h2>🎯 لوحة التحدي</h2>
                </div>

                <div class="player-box red-theme">

                    <span id="score2">400</span>
                    <button class="score-btn" onclick="adjustScore('player2', 200)">+</button>
                    <input type="text" class="editable-name" value="ياسمين">
                </div>
            </footer>
        </div>

    </div>

    <!-- نافذة السؤال المنبثقة -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalCategory">اسم الفئة</h3>
            <p id="modalQuestionText">نص السؤال سيظهر هنا...</p>
            <div id="modalImageContainer"></div>
            <div id="modalAnswerText" onclick="revealAnswer()">[اضغط هنا لعرض الإجابة الصحيحة]</div>
            <button class="modal-close-btn" onclick="closeModal()">إغلاق وتسجيل النقاط ✓</button>
        </div>
    </div>

                    { points: 200, q: "ما هي عاصمة دولة أستراليا؟", a: "كانبيرا" },
                    { points: 400, q: "ما هي عاصمة كندا؟", a: "أوتاوا" },
                    { points: 400, q: "ما هي عاصمة اليابان؟", a: "طوكيو" },
                    { points: 600, q: "ما هي عاصمة الأرجنتين؟", a: "بوينس آيرس" },
                    { points: 600, q: "ما هي عاصمة النمسا؟", a: "فيينا" }
                ]
            },
            {
                id: 9, name: "باب الحارة", icon: "🏘️",
                questions: [
                    { points: 200, q: "ما هو لقب شخصية 'عصام' في باب الحارة؟", a: "عصام الحلاق" },
                    { points: 200, q: "من هو زعيم حارة الضبع في الجزء الأول؟", a: "العقيد أبو شهاب" },
                    { points: 400, q: "ما اسم الحارة المنافسة لحارة الضبع؟", a: "حارة أبو النار" },
                    { points: 400, q: "شخصية عُرفت بجملة 'حيف يا زلمة'؟", a: "أبو شهاب" },
                    { points: 600, q: "الصيدلي الذي دخل الحارة وتزوج مأمون بيض البقر لاحقاً؟", a: "العتريس" },
                    { points: 600, q: "في أي جزء ظهر أبو جودت كرئيس مخفر؟", a: "الجزء الأول" }
                ]
            }
        ];

        let selectedCategoryIds = [];

        // توليد بطاقات الاختيار في الشاشة الأولى
        const pickerGrid = document.getElementById('pickerGrid');
        allCategories.forEach(cat => {
            const card = document.createElement('div');
            card.classList.add('picker-card');
            card.innerHTML = `
                <div style="font-size: 2rem; margin-bottom: 6px;">${cat.icon}</div>
                <h4>${cat.name}</h4>
                <span>6 أسئلة ممتعة</span>
            `;
            
            card.addEventListener('click', function() {
                toggleCategorySelection(cat.id, card);
            });
            
            pickerGrid.appendChild(card);
        });

        function toggleCategorySelection(catId, cardElement) {
            const index = selectedCategoryIds.indexOf(catId);
            
            if (index > -1) {
                selectedCategoryIds.splice(index, 1);
                cardElement.classList.remove('selected');
            } else {
                if (selectedCategoryIds.length < 6) {
                    selectedCategoryIds.push(catId);
                    cardElement.classList.add('selected');
                } else {
                    alert('يمكنك اختيار 6 فئات فقط لكل جولة! قم بإلغاء إحداهن لاختيار غيرها.');
                }
            }
            
            document.getElementById('counterText').innerText = `تم اختيار (${selectedCategoryIds.length} / 6) فئات`;
            document.getElementById('startBtn').disabled = selectedCategoryIds.length !== 6;
        }

        let activeCategoriesData = [];
        let currentCatIdx = 0;
        let currentQIdx = 0;
        let activeTileElement = null;
        let currentAnswerText = "";

        function startGame() {
            activeCategoriesData = allCategories.filter(cat => selectedCategoryIds.includes(cat.id));
            
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            
            buildBoard();
        }

        function buildBoard() {
            const boardGrid = document.getElementById('boardGrid');
            boardGrid.innerHTML = '';
            
            activeCategoriesData.forEach((cat, catIdx) => {
                cat.questions.forEach((qObj, qIdx) => {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.innerHTML = `<span>${qObj.points}</span><span class="cat-label">${cat.name}</span>`;
                    
                    tile.addEventListener('click', function() {
                        if(!tile.classList.contains('disabled')) {
                            openQuestionModal(catIdx, qIdx, tile);
                        }
                    });
                    
                    boardGrid.appendChild(tile);
                });
            });
        }

        function openQuestionModal(catIdx, qIdx, tileElement) {
            currentCatIdx = catIdx;
            currentQIdx = qIdx;
            activeTileElement = tileElement;

            const category = activeCategoriesData[catIdx];
            const qData = category.questions[qIdx];
            currentAnswerText = qData.a;

            document.getElementById('modalCategory').innerText = `فئة: ${category.name} (${qData.points} نقطة)`;
            document.getElementById('modalQuestionText').innerText = qData.q;
            
            // إدارة الصور إن وجدت في السؤال
            const imgContainer = document.getElementById('modalImageContainer');
            imgContainer.innerHTML = "";
            if (qData.img) {
                const img = document.createElement('img');
                img.src = qData.img;
                img.classList.add('modal-image');
                imgContainer.appendChild(img);
            }
            
            const ansDiv = document.getElementById('modalAnswerText');
            ansDiv.innerText = "[اضغط هنا لعرض الإجابة الصحيحة]";
            ansDiv.style.color = "#16a34a";

            document.getElementById('questionModal').style.display = 'flex';
        }

        function revealAnswer() {
            const ansDiv = document.getElementById('modalAnswerText');
            ansDiv.innerText = `الإجابة الصحيحة: ${currentAnswerText}`;
            ansDiv.style.color = "#dc2626";
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            if(activeTileElement) {
                activeTileElement.classList.add('disabled');
                activeTileElement.innerHTML = `<span>✓</span><span class="cat-label">تم</span>`;
            }
        }

        // نظام النقاط وتعديل الأسماء
        let scores = { player1: 400, player2: 400 };

        function adjustScore(player, amount) {
            scores[player] += amount;
            document.getElementById('score1').innerText = scores.player1;
            document.getElementById('score2').innerText = scores.player2;
        }
    </script>
</body>
</html>
